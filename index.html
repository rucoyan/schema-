<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Städschema">
<title>Städschema</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--mut:#6e6e73;--acc:#0a66c2;--accfg:#fff;--line:#e2e2e7;--danger:#c62828;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101113;--card:#1c1d20;--text:#f2f2f4;--mut:#a0a0a8;--acc:#4da3ff;--accfg:#06121f;--line:#2e3035;--danger:#ff6b6b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101113;--card:#1c1d20;--text:#f2f2f4;--mut:#a0a0a8;--acc:#4da3ff;--accfg:#06121f;--line:#2e3035;--danger:#ff6b6b;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:20px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
#clock{font-size:64px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
#date{font-size:24px;color:var(--mut);text-align:right}
.tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:16px}
.tab{font-size:20px;padding:16px 4px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);position:relative}
.tab.on{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:700}
.tab.today::after{content:"";position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--acc)}
.tab.on.today::after{background:var(--accfg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px 20px 20px}
h1{font-size:30px;margin:16px 0 8px}
.row{display:grid;grid-template-columns:1fr 220px;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line);font-size:24px}
.row:last-of-type{border-bottom:0}
.time{font-weight:700;font-variant-numeric:tabular-nums}
.who{color:var(--acc);font-weight:600;text-align:right}
.row.ed{grid-template-columns:1fr 52px}h2{font-size:18px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:22px 0 4px}.add{margin-top:10px;font-size:18px;padding:10px 16px}
.in{font:inherit;font-size:20px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);width:100%;min-width:0}
.empty{color:var(--mut);font-size:22px;padding:24px 0}
.bar{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{font:inherit;font-size:20px;padding:14px 22px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text)}
.btn.p{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:600}
.del{font-size:20px;border:0;background:transparent;color:var(--danger);padding:10px}
#add{margin-top:14px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:20px;z-index:5}
.ov.show{display:flex}
.modal{background:var(--card);border-radius:18px;padding:24px;width:100%;max-width:380px}
.modal h2{margin:0 0 12px;font-size:24px}
.err{color:var(--danger);min-height:22px;margin:6px 0}
@media(max-width:700px){#clock{font-size:44px}.row{grid-template-columns:1fr;font-size:20px;gap:4px}.who{text-align:left}.row.ed{grid-template-columns:1fr 44px}}
.row.chk{grid-template-columns:44px 1fr 220px auto;cursor:pointer;-webkit-tap-highlight-color:transparent}
.box{width:36px;height:36px;border:2px solid var(--mut);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--accfg)}
.done .box{background:var(--acc);border-color:var(--acc)}
.done>div:not(.box):not(.who){color:var(--text)}
.done .who{justify-self:end;background:#2e9e4f;color:#fff;font-weight:700;font-size:22px;padding:4px 14px;border-radius:999px}
.done .who:empty{background:none;padding:0}
@media(max-width:700px){.row.chk{grid-template-columns:44px 1fr auto}.row.chk .who{grid-column:2}.row.chk .sbtns{grid-column:3;grid-row:1}}
.row.ed{grid-template-columns:1fr 52px}
.whoc{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 4px 4px 12px;font-size:18px;display:inline-flex;align-items:center;gap:2px}
.cx,.nx{border:0;background:transparent;color:var(--danger);font-size:16px;padding:6px 8px}
.addn{width:auto;flex:1;min-width:140px;font-size:18px}
.nadd{display:flex;gap:10px;margin-top:12px}
@media(max-width:700px){.row.ed{grid-template-columns:1fr 44px}}
.ver{text-align:right;font-size:13px;color:var(--mut);margin:-6px 0 8px}
.selfbtn{border:1px solid var(--acc);color:var(--acc);background:transparent;border-radius:12px;font:inherit;font-size:18px;font-weight:600;padding:8px 10px}
.nb{display:block;width:100%;text-align:left;margin-bottom:8px}
.rk{border:0;background:transparent;font-size:15px;padding:4px}
.hint{color:var(--mut);font-size:15px;margin-top:8px}
.modal h2{text-transform:none;letter-spacing:0;color:var(--text)}
.glow{border-color:#f5a623;background:rgba(245,166,35,.18);animation:glow 1.6s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(245,166,35,.8)}50%{box-shadow:0 0 14px 4px rgba(245,166,35,.8)}}
.row.ced{grid-template-columns:1fr 190px 190px 52px}
.cdel{font-size:20px;border:0;background:transparent;color:var(--danger);padding:10px}
.tel{color:var(--acc);text-decoration:none}
@media(max-width:700px){.row.ced{grid-template-columns:1fr 1fr}.row.chk.done .who{justify-self:start}}
.box{color:var(--danger);border-color:var(--danger);font-weight:700}
.done .box{background:#2e9e4f;border-color:#2e9e4f;color:#fff}
.dng{color:var(--danger);border-color:var(--danger)}
.red{color:var(--danger)}
.tab small{font-size:13px;opacity:.85}
.tab.red:not(.on){color:var(--danger)}
.tab.on.red{background:var(--danger);border-color:var(--danger)}
.by{color:#2e9e4f;font-weight:700;font-size:18px;margin-top:2px}
.done .who{background:none;color:var(--acc);padding:0;font-size:inherit;font-weight:600;justify-self:stretch}
.ua.x{border:0;background:transparent;color:var(--danger);font-size:20px;padding:10px}
:root[data-th]{--accfg:#fff}
:root[data-th] #clock::before{content:var(--ico)}
#snow{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
#snow span{position:absolute;top:-30px;color:#8fb8e8;font-size:22px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
#kb{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));display:none;user-select:none;-webkit-user-select:none}
#kb.on{display:block}
#kb .kr{display:flex;gap:6px;margin-bottom:6px;justify-content:center}
#kb .k{flex:1;max-width:90px;height:56px;font:inherit;font-size:24px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);touch-action:manipulation;padding:0}
#kb .k:active,#kb .k.on{background:var(--acc);color:var(--accfg)}
#kb .k.w{flex:5;max-width:none;font-size:18px}
#kb .k.s{flex:1.6;max-width:140px;font-size:20px}
#kb .k.r{flex:none;width:110px;max-width:none;margin-left:auto;font-size:22px}
html.kbc #kb{padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
html.kbc #kb .k{height:clamp(34px,calc((40vh - 56px)/5),54px);font-size:clamp(16px,3.2vh,22px)}
html.kbc #kb .kr{gap:4px;margin-bottom:4px}
html.kbc #kb .kh{display:flex;justify-content:flex-end;margin-bottom:4px}
html.kbc #kb .k.hd{flex:none;max-width:none;width:auto;padding:0 16px;height:34px;font-size:15px}
html.kbc.kbopen .ov{padding-bottom:calc(var(--kbh,0px) + 12px)}
@media(max-width:480px){html.kbc #kb .k.r{width:64px}html.kbc #kb .k.s{max-width:80px}}
@media(min-width:700px){html.kbc #kb{left:50%;right:auto;transform:translateX(-50%);width:min(720px,100%);border:1px solid var(--line);border-radius:14px 14px 0 0}}
html.kbc{--kh:clamp(44px,calc((46vh - 56px)/5),64px);--kf:clamp(18px,min(3.6vh,5.2vw),26px)}
html.kbc[data-kbs=l]{--kh:clamp(52px,calc((54vh - 56px)/5),78px);--kf:clamp(20px,min(4.2vh,6vw),30px)}
html.kbc[data-kbs=s]{--kh:clamp(36px,calc((38vh - 56px)/5),52px);--kf:clamp(16px,min(3vh,4.5vw),22px)}
html.kbc #kb .k{height:var(--kh);font-size:var(--kf);-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html.kbc #kb .k:active{background:var(--acc);color:var(--accfg)}
html.kbc #kb .k.hd{height:40px;font-size:16px}
@media(max-width:480px){html.kbc #kb{padding-left:3px;padding-right:3px}html.kbc #kb .kr{gap:3px}}
.warn .box{background:#e6a700;border-color:#e6a700;color:#fff}
.by.wn{color:#e6a700}
.mtab{font:inherit;font-size:17px;padding:12px 4px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text)}
.mtab.on{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:700}
.nw{background:var(--acc);color:var(--accfg);border-radius:8px;padding:1px 7px;font-size:13px;font-weight:700}
.mdel{border:0;background:transparent;font-size:20px;padding:8px}
.sbtns{display:flex;gap:8px;justify-content:flex-end;align-items:center}
.assbtn{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:12px;font:inherit;font-size:18px;padding:8px 12px;white-space:nowrap}
.in:disabled{opacity:1;background:transparent;border-color:transparent;-webkit-text-fill-color:currentColor}
.in.kbact{border-color:#0a84ff;box-shadow:0 0 0 3px rgba(10,132,255,.45);outline:none;caret-color:transparent}
#kcaret{position:fixed;width:2px;background:#0a84ff;border-radius:1px;z-index:60;pointer-events:none;display:none;animation:kcb 1s step-end infinite}
@keyframes kcb{0%,100%{opacity:1}50%{opacity:0}}
.inf{border:0;background:transparent;font-size:20px;padding:0 6px;line-height:1}
.ov{overflow:auto}
html.kbopen .ov{padding-bottom:calc(var(--kbh,0px) + 12px)}
.ov{align-items:flex-start}
.ov>.modal{margin:auto}
.row.chk{cursor:default}
.row.chk .ttxt,.row.chk .who{cursor:pointer}
.row.chk .box{cursor:pointer;position:relative}
.row.chk .box::after{content:'';position:absolute;inset:-14px -10px}
#kb .kh{display:flex;justify-content:flex-end;margin-bottom:6px}
#kb .k.hd{flex:none;max-width:none;width:auto;padding:0 18px;height:40px;font-size:16px}
.iit{display:flex;gap:10px;align-items:flex-start;margin:10px 0}
.iit img{width:96px;height:96px;object-fit:cover;border-radius:10px;flex:none}
.iit .icap{flex:1;min-width:0}
.idel{border:0;background:transparent;color:var(--danger);font-size:22px;padding:6px 8px}
.ivw{margin:14px 0}
.ivw img{max-width:100%;border-radius:12px;display:block}
.ivw .icp{color:var(--mut);margin-top:6px;white-space:pre-wrap}
#kb .k.pressed{background:#0a84ff;color:#fff;border-color:#0a84ff;transform:scale(.95)}
#kpop{position:fixed;z-index:80;width:56px;height:60px;display:none;align-items:center;justify-content:center;background:var(--card);color:var(--text);border:2px solid #0a84ff;border-radius:12px;font-size:32px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.35);pointer-events:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="ver">Städschema Beta v1.0<span id="vcred"></span><span id="dbs"></span></div>
  <header>
    <div id="clock">--:--:--</div>
    <div id="date"></div>
  </header>
  <div class="bar" id="bar" style="margin:0 0 14px"></div>
  <div class="tabs" id="tabs"></div>
  <div class="card">
    <h1 id="title"></h1>
    <div id="body"></div>
  </div>
</div>

<div class="ov" id="ov">
  <div class="modal">
    <h2 id="mt"></h2>
    <input class="in" id="pw" type="password" autocomplete="off">
    <div class="err" id="err"></div>
    <div class="bar" style="margin:0">
      <button class="btn p" id="ok">OK</button>
      <button class="btn" id="cancel">Avbryt</button>
    </div>
  </div>
</div>

<script>
const DAYS=['Måndag','Tisdag','Onsdag','Torsdag','Fredag','Lördag','Söndag'];
const MON=['januari','februari','mars','april','maj','juni','juli','augusti','september','oktober','november','december'];
const KEY='stadschema_v2';
const R=['Rondering kl. 10','Rondering kl. 14'];
const D=[
 [...R,'Informationsdiskar avtorkas','Sopmaskin','Stora skurmaskin','Badrumsvärlden','Belysningsvärlden','Drive-in kassa','Drive-in golv','Personalutrymmen','Sopa under hyllor etc.'],
 [...R,'Informationsdiskar','Sopmaskin','Stora skurmaskin','Badrumsvärlden','Kakel/Golv utställningar','Trädgårdscenter','Varumottagning Golv','Kontor','Konferensrum','Vilorum'],
 [...R,'Informationsdiskar avtorkas','Sopmaskin','Stora skurmaskin','Badrumsvärlden','Belysningsvärlden','Drive-in kassa','Personalutrymmen','Sopa under hyllor etc.'],
 [...R,'Informationsdiskar','Sopmaskin','Stora skurmaskin','Badrumsvärlden'],
 [...R,'Informationsdiskar avtorkas','Sopmaskin','Stora skurmaskin','Badrumsvärlden','Sopa under hyllor etc.','Belysningsvärlden','Kakel/Golv utställningar','Trädgårdscenter','Drive-in kassa','Varumottagning Golv','Vilorum','Personalutrymmen'],
 [R[0],'Informationsdiskar','Sopmaskin','Stora skurmaskin','Badrumsvärlden','Sopa under hyllor etc.','Drive-in kassa'],
 ['Informationsdiskar']];
const NAMES=[];
const nlist=()=>S.names||(S.names=[...NAMES]);
const whoArr=w=>w?String(w).split(', ').filter(Boolean):[];
function addOpts(w){const a=whoArr(w);return '<option value="">+ Lägg till namn</option>'+nlist().filter(n=>!a.includes(n)).map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('')+'<option value="__other__">✏️ Skriv eget namn…</option>';}
function whoCell(s,k){const w=arr(s)[k].who;return whoArr(w).map((n,j)=>`<span class="chip">${esc(n)}<button class="cx" data-j="${j}">✕</button></span>`).join('')+`<select class="in addn" data-f="addname">${addOpts(w)}</select>`;}
function addWho(t,n){n=String(n).replace(/,/g,' ').trim();if(!n)return;const a=whoArr(t.who);if(!a.includes(n)){a.push(n);t.lock=(t.lock||[]).concat(n);}t.who=a.join(', ');save();}
function refreshWho(c){c.innerHTML=whoCell(c.dataset.s,+c.dataset.k);}
function nameMgr(){return '<h2>Namnlista</h2><div class="whoc">'+nlist().map((n,j)=>`<span class="chip">${esc(n)}<button class="nx" data-j="${j}">✕</button></span>`).join('')+'</div><div class="nadd"><input class="in" id="newname" placeholder="Nytt namn"><button class="btn" id="addname">Lägg till i listan</button></div><div class="nadd" style="margin-top:22px"><button class="btn dng" id="pwreset">🔑 Ta bort lösenord…</button></div>';}
function addListName(){const n=$('newname').value.replace(/,/g,' ').trim();if(n&&!nlist().includes(n)){nlist().push(n);save();}render();}

function pwResetOpen(){
  selfClose();
  SM=document.createElement('div');SM.className='ov show';
  SM.innerHTML='<div class="modal" style="max-height:85vh;overflow:auto"><h2>Ta bort lösenord</h2><div id="sbody"></div><div class="bar" style="margin:12px 0 0"><button class="btn" id="scancel">Avbryt</button></div></div>';
  document.body.appendChild(SM);
  SM.querySelector('#scancel').onclick=selfClose;
  const ns=nlist().filter(n=>S.pws&&S.pws[n]),b=SM.querySelector('#sbody');
  b.innerHTML=ns.length?'<p style="margin:0 0 10px;color:var(--mut)">Välj vems lösenord som ska tas bort</p>'+ns.map(n=>`<button class="btn nb" data-n="${esc(n)}">${esc(n)}</button>`).join(''):'<p style="margin:0">Inga namn har något eget lösenord.</p>';
  b.onclick=e=>{
    const x=e.target.closest('.nb');if(!x)return;
    const n=x.dataset.n;
    askYes('Ta bort lösenordet för '+n+'? Personen väljer ett nytt nästa gång.',()=>{if(S.pws)delete S.pws[n];save();render();});
  };
}

async function hash(t){
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('stad:'+t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
  catch(e){return 'x'+btoa(unescape(encodeURIComponent(t)));}
}
const GATE={s:'15d7b81d835be043a40da80852a4493f',i:300000,h:'d94c47f6b111aea8e6a0de809995d5fc31b101ffdb2a632ea8f7e536c878937b'};
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const unhex=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
const canCrypto=()=>!!(window.crypto&&crypto.subtle&&crypto.getRandomValues);
async function kdf(pw,salt,iter){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);return hex(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:salt,iterations:iter},k,256));}
async function gateOk(pw){if(!canCrypto())return null;return (await kdf(pw,unhex(GATE.s),GATE.i))===GATE.h;}
async function makePw(pw){if(!canCrypto())return null;const salt=crypto.getRandomValues(new Uint8Array(16));return 'p2$'+hex(salt)+'$'+await kdf(pw,salt,150000);}
async function verifyPw(stored,name,pw){
  if(!stored)return false;
  if(!canCrypto())return null;
  if(String(stored).startsWith('p2$')){const parts=stored.split('$');return (await kdf(pw,unhex(parts[1]),150000))===parts[2];}
  return (await hash(pwKey(name)+':'+pw))===stored;
}
function lockLeft(k){try{const o=JSON.parse(localStorage.getItem('stad_f_'+k)||'null');return o&&o.until>Date.now()?Math.ceil((o.until-Date.now())/1000):0;}catch(e){return 0;}}
function failBump(k){try{const o=JSON.parse(localStorage.getItem('stad_f_'+k)||'null')||{n:0,until:0};o.n++;if(o.n%5===0)o.until=Date.now()+Math.min(600,30*Math.pow(2,o.n/5-1))*1000;localStorage.setItem('stad_f_'+k,JSON.stringify(o));}catch(e){}}
function failClear(k){try{localStorage.removeItem('stad_f_'+k);}catch(e){}}
const HTTPSMSG='Det här kräver en säker (https) anslutning.';
let SM=null;
function selfClose(){if(SM){SM.remove();SM=null;}}
function hm(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function logout(){user=null;edit=histOn=monthOn=contactsOn=usersOn=setOn=msgOn=false;selfClose();applyTheme();render();}
function infoBox(m){askYes(m,()=>{});SM.querySelector('#nn').remove();SM.querySelector('#yy').textContent='OK';}
function loginOpen(){
  selfClose();
  SM=document.createElement('div');SM.className='ov show';SM.style.background='var(--bg)';
  SM.innerHTML='<div class="modal" style="max-height:90vh;overflow:auto"><h2>Logga in</h2><div id="sbody"></div></div>';
  document.body.appendChild(SM);loginPick();
}
function loginPick(){
  const b=SM.querySelector('#sbody');
  b.innerHTML='<p style="margin:0 0 10px;color:var(--mut)">Välj ditt namn</p>'+nlist().map((n,j)=>`<button class="btn nb" data-j="${j}">${esc(n)}</button>`).join('')+(S.pending||[]).map(p=>'<div style="color:var(--mut);margin:0 0 8px">'+esc(p.name)+' – väntar på godkännande</div>').join('')+'<button class="btn" id="lcancel" style="margin-top:8px;width:100%">Avbryt</button>';
  b.onclick=e=>{if(e.target.id==='lcancel'){selfClose();return;}const x=e.target.closest('.nb');if(x)authName(nlist()[+x.dataset.j]);};b.onkeydown=null;
}
function authName(name){
  const b=SM.querySelector('#sbody'),first=!(S.pws&&S.pws[name]),adm=isAdmin(name);

function defSched(){
  const m=['Bistro','WC Kund','Entré & Vindfång','Kassalinjen','Byta säckar utomhus'];
  const days={};
  for(let i=0;i<7;i++)days[i]={morn:mk(i===6?m.filter(t=>!t.startsWith('Kassalinjen')):i===2?[...m.filter(t=>t!=='Byta säckar utomhus'),'Plocka skräp och byta säckar utomhus']:m),day:mk([...D[i],'WC Kund eftermiddag'])};
  return {days,monthly:mk(['Fönsterputs','Avtorka brandsläckare'])};
}

function partDo(k){
  const msg={day:'Nollställa dagens avbockningar och namn?',mon:'Nollställa månadsuppgifterna?',sch:'Återställa schemat till standard? Egna ändringar av uppgifterna försvinner, och avbockningar och namn nollställs också.',his:'Rensa hela historiken?',con:'Rensa alla kontakter?'}[k];
  askYes(msg,()=>{
    const clr=l=>l.forEach(t=>{t.who='';t.lock=[];t.done=false;t.warn='';t.miss=[];t.doneBy='';t.doneAt='';t.markedBy='';});
    if(k==='day'){const d=S.days[todayIdx()];clr(d.morn);clr(d.day);}
    else if(k==='mon')clr(S.monthly);
    else if(k==='sch'){const d=defSched();S.days=d.days;S.monthly=d.monthly;}
    else if(k==='his')S.history={};
    else if(k==='con')S.contacts=[];

}

function askSeq(qs,i,miss,done,undo){

function sendMsg(){
  const to=$('mto').value,tx=($('mtx').value||'').trim().slice(0,300);

  if(S.msgs.length>200)S.msgs=S.msgs.slice(-200);

function msgAct(a,id){
  if(a==='ok'||a==='no'){
    if(!isAdmin())return;
    const p=(S.pending||[]).find(x=>x.id===id);if(!p)return;
    if(a==='ok'){
      nlist().push(p.name);S.pws=S.pws||{};S.pws[p.name]=p.pw;
      S.pending=S.pending.filter(x=>x.id!==id);
      (S.msgs=S.msgs||[]).push({id:uid(),from:'System',to:p.name,text:'Ditt konto har godkänts. Välkommen!',ts:Date.now(),readBy:[],del:[]});
      save();render();infoBox(p.name+' är godkänd och kan nu logga in.');
    }else askYes('Avslå kontoförfrågan från '+p.name+'?',()=>{S.pending=S.pending.filter(x=>x.id!==id);save();render();});
  }else if(a==='re'){const m=(S.msgs||[]).find(x=>x.id===id);if(m){msgTo=m.from;msgCat='new';render();}}
  else if(a==='del'){const m=(S.msgs||[]).find(x=>x.id===id);if(m){(m.del=m.del||[]).push(user);save();render();}}
}

function pwKey(n){return (S.salt&&S.salt[n])||n;}
function renameUser(o,n){
  const ren=x=>x===o?n:x,fixWho=w=>whoArr(w).map(ren).join(', ');
  S.names=nlist().map(ren);
  S.admins=(S.admins||[]).map(ren);
  S.planners=(S.planners||[]).map(ren);
  if(S.pws&&o in S.pws){S.pws[n]=S.pws[o];delete S.pws[o];}
  S.salt=S.salt||{};S.salt[n]=S.salt[o]||o;delete S.salt[o];
  if(S.tOff&&o in S.tOff){S.tOff[n]=S.tOff[o];delete S.tOff[o];}
  const fix=t=>{t.who=fixWho(t.who);if(t.lock)t.lock=t.lock.map(ren);if(t.doneBy)t.doneBy=ren(t.doneBy);if(t.by)t.by=ren(t.by);};
  for(let i=0;i<7;i++){S.days[i].morn.forEach(fix);S.days[i].day.forEach(fix);}
  (S.monthly||[]).forEach(fix);
  Object.values(S.history||{}).forEach(d=>{(d.morn||[]).forEach(fix);(d.day||[]).forEach(fix);});
  (S.msgs||[]).forEach(m=>{m.from=ren(m.from);m.to=ren(m.to);if(m.del)m.del=m.del.map(ren);if(m.readBy)m.readBy=m.readBy.map(ren);});
  if(user===o)user=n;
  save();
}

function infoOf(t){const i=(S.info||{})[infoKey(t)];if(!i)return null;if(i.img&&!i.imgs){i.imgs=[{src:i.img,cap:''}];delete i.img;}return i;}
function hasInfo(t){const i=infoOf(t);return !!(i&&(i.desc||(i.imgs&&i.imgs.length)));}
function loadImg(file,cb){
  const fr=new FileReader();
  fr.onload=()=>{const im=new Image();im.onload=()=>{
    const sc=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(im.width*sc));c.height=Math.max(1,Math.round(im.height*sc));
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    cb(c.toDataURL('image/jpeg',0.72));};
    im.onerror=()=>cb(null);im.src=fr.result;};
  fr.onerror=()=>cb(null);fr.readAsDataURL(file);
}

    const fin=(by,miss,first)=>{
      const w=miss.length?M.name+' är '+miss.map(k=>M.qs.find(x=>x.k===k).w).join(' och '):'';
      if(first||!miss.length){t.doneBy=by;t.doneAt=hm();t.markedBy=by!==user?user:'';}
      t.done=true;t.miss=miss;t.warn=w;save();render();
      if(miss.length&&first)infoBox('Obs! '+w+'. Tryck på uppgiften igen när det är gjort.');
    };
    const go=by=>{
      if(M){askSeq(M.qs,0,[],m=>fin(by,m,true),null);return;}
      t.done=true;t.warn='';t.miss=[];t.doneBy=by;t.doneAt=hm();t.markedBy=by!==user?user:'';save();render();
    };
    if(t.done&&t.warn&&M){const qs=(t.miss&&t.miss.length)?M.qs.filter(x=>t.miss.includes(x.k)):M.qs;askSeq(qs,0,[],m=>fin(user,m,false),un);return;}
    if(t.done){un();return;}
    if(canPlan()){pickWho(t,go);return;}
    go(user);return;}
  const x=e.target.closest('.cx');
  if(x){const cell=x.closest('.whoc'),t=arr(cell.dataset.s)[+cell.dataset.k],a=whoArr(t.who);const rn=a.splice(+x.dataset.j,1)[0];t.lock=(t.lock||[]).filter(n=>n!==rn);t.who=a.join(', ');save();refreshWho(cell);return;}
  const nx=e.target.closest('.nx');
  if(nx){const j=+nx.dataset.j,nn=nlist()[j];askYes('Ta bort '+nn+' från namnlistan?'+(S.pws&&S.pws[nn]?' Personens lösenord tas också bort.':''),()=>{nlist().splice(j,1);if(S.pws)delete S.pws[nn];save();render();});return;}
  if(e.target.id==='pwreset'){pwResetOpen();return;}
  if(e.target.id==='addname'){addListName();return;}
  const a=e.target.closest('.add');
  if(a){arr(a.dataset.s).push({text:'',who:'',done:false,by:user});save();render();return;}
  const d=e.target.closest('.del');
  if(d){const ss=d.dataset.s,kk=+d.dataset.k,tt=arr(ss)[kk];if(!isAdmin()&&tt.by!==user){infoBox('Du kan bara ta bort uppgifter som du själv har lagt till.');return;}askYes('Ta bort uppgiften'+(tt.text?' "'+tt.text+'"':'')+'?',()=>{arr(ss).splice(kk,1);save();render();});return;}
});
$('bar').addEventListener('click',e=>{
  if(e.target.id==='bEdit')openModal('unlock');
  if(e.target.id==='bHist')openModal('hist');
  if(e.target.id==='bBack'){if(setOn&&(histOn||usersOn||contactsOn||edit)){histOn=usersOn=contactsOn=edit=false;}else{histOn=monthOn=contactsOn=usersOn=edit=setOn=msgOn=false;}render();}
  if(e.target.id==='bSettings'){setOn=true;render();}
  if(e.target.id==='bLogout')logout();
  if(e.target.id==='bTheme'){S.tOff=S.tOff||{};const tk=user||'_';S.tOff[tk]=!S.tOff[tk];save();applyTheme();render();}
  if(e.target.id==='bLogin')loginOpen();
  if(e.target.id==='bSignup')signupOpen();
  if(e.target.id==='bMsg'){msgOn=true;msgCat=(isAdmin()&&pendN())?'req':'in';render();}
  if(e.target.id==='bMonth'){monthOn=true;render();}
  if(e.target.id==='bContacts'){contactsOn=true;render();}
  if(e.target.id==='bCedit')openModal('contacts');
  if(e.target.id==='bCdone'){cedit=false;render();}
  if(e.target.id==='bPw')openModal('change');
  if(e.target.id==='bDone'){edit=false;save();render();}
});

function openModal(m){
  mode=m;$('mt').textContent=m==='change'?'Nytt lösenord':'Ange lösenord';
  $('pw').value='';$('err').textContent='';$('ov').classList.add('show');setTimeout(()=>$('pw').focus(),50);
}
function closeModal(){$('ov').classList.remove('show');}
function submit(){
  const v=$('pw').value;
  if(mode!=='change'){
    if(v===S.pw){closeModal();if(mode==='unlock')edit=true;else if(mode==='hist')histOn=true;else if(mode==='day'&&pendDay!==null)sel=pendDay;else if(mode==='contacts')cedit=true;render();}
    else $('err').textContent='Fel lösenord';
  }else{
    if(!v){$('err').textContent='Lösenordet kan inte vara tomt';return;}
    S.pw=v;save();closeModal();
  }
}
$('ok').onclick=submit;
$('cancel').onclick=closeModal;
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')submit();});

let unlocked=false;
const needSetup=()=>!((S.admins||[]).length);
function renderSetup(){
  $('tabs').innerHTML='';$('title').textContent='';$('bar').innerHTML='';
  $('body').innerHTML='<div style="max-width:440px;margin:20px auto"><div style="font-size:26px;font-weight:700;margin:0 0 6px">👋 Installation</div><p style="color:var(--mut);margin:0 0 14px">Skapa administratörskontot. Administratören lägger sedan till användare och kontakter och ändrar schemat.</p><input class="in" id="sn" placeholder="Ditt namn" autocomplete="off"><input class="in" id="sp1" type="password" placeholder="Välj lösenord" autocomplete="off" style="margin-top:8px"><input class="in" id="sp2" type="password" placeholder="Upprepa lösenordet" autocomplete="off" style="margin-top:8px"><input class="in" id="sc" placeholder="Utvecklat av (valfritt, visas uppe till höger)" autocomplete="off" style="margin-top:14px"><div class="err" id="serr2"></div><button class="btn p" id="sgo" style="width:100%;margin-top:8px">Skapa konto</button></div>';
  const go=async()=>{
    const n=$('sn').value.replace(/[,\s]+/g,' ').trim(),a=$('sp1').value,e=$('serr2');
    if(!n){e.textContent='Skriv ditt namn';return;}
    if(a.length<6){e.textContent='Lösenordet måste vara minst 6 tecken';return;}
    if(a!==$('sp2').value){e.textContent='Lösenorden är inte lika';return;}
    const hp=await makePw(a);if(!hp){e.textContent=HTTPSMSG;return;}
    S.names=[n];S.admins=[n];S.pws={};S.pws[n]=hp;S.credit=($('sc').value||'').replace(/\s+/g,' ').trim().slice(0,60);save();applyCredit();user=n;lastAct=Date.now();render();
  };
  $('sgo').onclick=go;
}
function renderLock(){
  $('tabs').innerHTML='';$('title').textContent='';$('bar').innerHTML='';
  $('body').innerHTML='<div style="max-width:420px;margin:30px auto"><div style="font-size:26px;font-weight:700;margin:0 0 14px">🔒 Ange lösenord</div><input class="in" id="lpw" type="password" autocomplete="off" placeholder="Lösenord"><div class="err" id="lerr"></div><button class="btn p" id="lgo" style="width:100%;margin-top:8px">Öppna</button></div>';
  const go=async()=>{
    const left=lockLeft('gate');if(left){$('lerr').textContent='För många försök. Vänta '+left+' s.';return;}
    const r=await gateOk($('lpw').value);
    if(r===null){$('lerr').textContent=HTTPSMSG;return;}
    if(r){failClear('gate');unlocked=true;render();}else{failBump('gate');$('lerr').textContent='Fel lösenord';$('lpw').value='';}
  };
  $('lgo').onclick=go;
  $('lpw').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
  setTimeout(()=>{const i=$('lpw');if(i)i.focus();},50);
}
let DIAG={},LSERR='';
function fmtT(t){const d=new Date(t);return d.getDate()+'/'+(d.getMonth()+1)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function idbCount(cb){
  try{
    const rq=indexedDB.open('stad',1);
    rq.onupgradeneeded=()=>rq.result.createObjectStore('k');
    rq.onerror=()=>cb(null,rq.error&&rq.error.name);
    rq.onsuccess=()=>{const db=rq.result,tx=db.transaction('k','readwrite'),st=tx.objectStore('k'),g=st.get('n');
      g.onsuccess=()=>{const n=(g.result||0)+1;st.put(n,'n');tx.oncomplete=()=>{db.close();cb(n);};};
      g.onerror=()=>cb(null,'get');};
  }catch(e){cb(null,e.name);}
}
function diagStatus(){
  const r=DIAG,e=document.getElementById('dbs');if(!e)return;
  e.textContent=' · lagring: '+(r.lsErr?'⚠️ blockerad':'start nr '+(r.ls?r.ls.n:'?'))+' (tryck för test)';
}
function diagInit(){
  const r=DIAG={};
  try{r.origin=location.origin+' ('+location.protocol+')';}catch(e){r.origin='okänd';}
  try{r.iframe=window.top!==window;}catch(e){r.iframe=true;}
  r.standalone=!!navigator.standalone;
  try{const o=JSON.parse(localStorage.getItem('stad_diag')||'null')||{n:0,first:Date.now()};o.n++;localStorage.setItem('stad_diag',JSON.stringify(o));r.ls=o;}catch(e){r.lsErr=e.name+': '+e.message;}
  try{const m=document.cookie.match(/stad_n=(\d+)/),n=(m?+m[1]:0)+1;document.cookie='stad_n='+n+';max-age=31536000;path=/;SameSite=None;Secure';r.ck=document.cookie.includes('stad_n=')?n:null;}catch(e){r.ck=null;}
  try{r.ss=+(sessionStorage.getItem('stad_s')||0)+1;sessionStorage.setItem('stad_s',r.ss);}catch(e){r.ss=null;}
  idbCount((n,err)=>{r.idb=n;r.idbErr=err;});
  try{if(navigator.storage&&navigator.storage.persisted){navigator.storage.persisted().then(v=>{r.persisted=v;});if(navigator.storage.persist)navigator.storage.persist().then(v=>{r.persistReq=v;});}}catch(e){}
  try{if('serviceWorker' in navigator)navigator.serviceWorker.getRegistration().then(g=>{r.sw=g?(g.active?'aktiv – appen kan starta utan nät':'installeras'):'ej installerad';}).catch(()=>{r.sw='fel';});else r.sw='stöds inte här';}catch(e){r.sw='fel';}
  diagStatus();
  const v=document.querySelector('.ver');if(v)v.addEventListener('click',diagOpen);
}
function diagOpen(){
  selfClose();SM=document.createElement('div');SM.className='ov show';
  const r=DIAG,yn=v=>v==null?'okänt':(v?'ja':'nej');
  const L=[['Adress (origin)',r.origin],['Inbäddad i annan sida (iframe)',yn(r.iframe)],['Startad som hemskärmsapp',yn(r.standalone)],
   ['localStorage',r.lsErr?'FEL – '+r.lsErr:'fungerar, start nr '+r.ls.n+' (första '+fmtT(r.ls.first)+')'],
   ['Kaka (cookie)',r.ck?'fungerar, start nr '+r.ck:'fungerar inte'],
   ['IndexedDB',r.idb?'fungerar, start nr '+r.idb:'fungerar inte'+(r.idbErr?' ('+r.idbErr+')':'')],
   ['sessionStorage (nollställs när fliken stängs)',r.ss?'start nr '+r.ss:'fungerar inte'],
   ['Beständig lagring beviljad',yn(r.persisted)+' / begärd: '+yn(r.persistReq)],
   ['Offline-stöd (service worker)',r.sw||'okänt'],
   ['Senaste sparfel',LSERR||'inga']];
  SM.innerHTML='<div class="modal" style="max-width:520px;max-height:85vh;overflow:auto"><h2>Lagringstest</h2>'+L.map(([a,b])=>`<p style="margin:0 0 10px"><b>${esc(a)}</b><br>${esc(b)}</p>`).join('')+'<p style="color:var(--mut);margin:0 0 10px">Stäng appen helt och öppna den igen, och öppna sedan testet. Börjar "start nr" om på 1, eller ändras adressen, sparas inget mellan starterna.</p><div class="bar" style="margin:0"><button class="btn p" id="dclose">Stäng</button></div></div>';
  document.body.appendChild(SM);SM.querySelector('#dclose').onclick=selfClose;
}
resetIfNew();unlocked=!needSetup();applyTheme();render();tickClock();setInterval(tickClock,1000);diagInit();if('serviceWorker' in navigator&&location.protocol==='https:'&&window.top===window)navigator.serviceWorker.register('sw.js').catch(()=>{});['pointerdown','touchstart','keydown','scroll'].forEach(ev=>document.addEventListener(ev,()=>{lastAct=Date.now();},true));
</script>
